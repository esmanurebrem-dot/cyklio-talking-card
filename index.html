<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Cyklio Talking Card | Demo</title>
    <style>
        :root {
            --green: #2f5d45;
            --ink: #1f2b26;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        #ar {
            position: fixed;
            inset: 0;
        }

        .screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f8f5;
            color: var(--ink);
            text-align: center;
        }

        .screen[hidden] {
            display: none;
        }

        .screen h1 {
            margin: 0 0 8px;
            color: var(--green);
            font-size: 1.75rem;
        }

        .screen p {
            max-width: 32ch;
            margin: 0 auto 20px;
            line-height: 1.5;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 14px 28px;
            background: var(--green);
            color: #fff;
            font: 600 1rem inherit;
            font-family: inherit;
            cursor: pointer;
        }

        .small {
            display: block;
            margin-top: 18px;
            color: var(--green);
            font-size: .875rem;
        }

        .hint {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 5;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .9);
            color: var(--ink);
            font-size: .9375rem;
            white-space: nowrap;
        }

        .hint[hidden] {
            display: none;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
</head>

<body>
    <div id="ar"></div>
    <script>
        // Shows a message on screen if the AR code could not load, instead of doing nothing.
        window.addEventListener('error', e => { window.arError = e.message; });
        document.addEventListener('click', e => {
            if (e.target.id === 'start-btn' && !window.arReady) {
                document.querySelector('#start p').textContent =
                    'Still loading, or the AR code could not load' + (window.arError ? ': ' + window.arError : '.') + ' Please wait a moment and try again.';
            }
        });
    </script>

    <div class="screen" id="start">
        <div>
            <h1>Cyklio Talking Card</h1>
            <p>Point your camera at the Cyklio card and watch it come to life.</p>
            <button id="start-btn" type="button">Start camera</button>
            <a class="small" href="card.png" target="_blank">Open the card image</a>
        </div>
    </div>

    <div class="hint" id="hint" hidden>Point the camera at the card</div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';
        window.arReady = true;

        const CARD_ASPECT = 1024 / 1536;
        const startScreen = document.getElementById('start');
        const hint = document.getElementById('hint');

        // The animated layer that appears on top of the card.
        const canvas = document.createElement('canvas');
        canvas.width = 1536;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
        }

        function draw(t) {
            const w = canvas.width, h = canvas.height;
            const appear = Math.min(t / 0.6, 1);
            ctx.clearRect(0, 0, w, h);
            ctx.globalAlpha = appear;
            ctx.textAlign = 'center';

            // Speech bubble next to the person, with rotating messages.
            const lines = [
                ['Pick one task.', 'Small enough to begin.'],
                ['Start a focus cycle.', 'Cyklio protects your time.'],
                ['Take a real break.', 'You showed up. That counts.']
            ];
            const step = Math.floor(t / 3.5) % lines.length;
            const local = t % 3.5;
            const fade = Math.min(local / 0.4, 1, (3.5 - local) / 0.4);
            const pop = 0.9 + 0.1 * Math.min(local / 0.3, 1);
            ctx.save();
            ctx.globalAlpha = appear * fade;
            ctx.translate(250, 130);
            ctx.scale(pop, pop);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
            roundRect(-210, -70, 420, 140, 36);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(40, 66); ctx.lineTo(90, 120); ctx.lineTo(90, 66);
            ctx.fill();
            ctx.strokeStyle = '#2f5d45';
            ctx.lineWidth = 4;
            roundRect(-210, -70, 420, 140, 36);
            ctx.stroke();
            ctx.fillStyle = '#1f3d30';
            ctx.font = '700 40px "Segoe UI", sans-serif';
            ctx.fillText(lines[step][0], 0, -8);
            ctx.fillStyle = '#4f6b5c';
            ctx.font = '500 30px "Segoe UI", sans-serif';
            ctx.fillText(lines[step][1], 0, 38);
            ctx.restore();

            // The timer on the desk starts counting down.
            const cx = 1037, cy = 775, r = 98;
            const progress = (t % 20) / 20;
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#7fd1a3';
            ctx.beginPath();
            ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
            ctx.stroke();
            ctx.fillStyle = '#20473a';
            ctx.beginPath();
            ctx.arc(cx, cy, 72, 0, Math.PI * 2);
            ctx.fill();
            const secondsLeft = Math.max(0, Math.ceil(25 * 60 * (1 - progress)));
            const mm = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
            const ss = String(secondsLeft % 60).padStart(2, '0');
            ctx.fillStyle = '#ffffff';
            ctx.font = '600 44px "Segoe UI", sans-serif';
            ctx.fillText(`${mm}:${ss}`, cx, cy + 15);

            // Steam rising from the tea.
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 6;
            for (let i = 0; i < 3; i++) {
                const phase = (t * 0.8 + i / 3) % 1;
                const x = 815 + (i - 1) * 26, y = 700 - phase * 90;
                ctx.globalAlpha = appear * (1 - phase);
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.bezierCurveTo(x + 14, y - 18, x - 14, y - 36, x, y - 54);
                ctx.stroke();
            }
            ctx.globalAlpha = appear;

            // Twinkling sparkles around the logo.
            [[1205, 175], [690, 215], [1240, 590], [420, 230]].forEach(([x, y], i) => {
                const s = 10 + 8 * Math.abs(Math.sin(t * 2 + i));
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(x, y - s); ctx.lineTo(x + s / 3, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s / 3, y);
                ctx.fill();
            });

            // Pulsing label above the QR code.
            const pulse = 1 + 0.05 * Math.sin(t * 4);
            ctx.save();
            ctx.translate(1372, 630);
            ctx.scale(pulse, pulse);
            ctx.fillStyle = '#2f5d45';
            roundRect(-150, -32, 300, 64, 32);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '600 30px "Segoe UI", sans-serif';
            ctx.fillText('Scan to try Cyklio', 0, 10);
            ctx.restore();

            ctx.globalAlpha = 1;
            texture.needsUpdate = true;
        }

        // If a video.mp4 file is next to this page, it plays on the card instead of the animation.
        const video = document.createElement('video');
        video.src = 'video.mp4';
        video.loop = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.preload = 'auto';
        const hasVideo = fetch('video.mp4', { method: 'HEAD' }).then(r => r.ok).catch(() => false);

        async function start() {
            // Start and pause the video inside the tap, so the phone allows it to play with sound later.
            const useVideo = await Promise.race([hasVideo, new Promise(r => setTimeout(() => r(false), 1500))]);
            if (useVideo) {
                try { await video.play(); video.pause(); } catch (e) { video.muted = true; }
            }
            startScreen.hidden = true;
            const mindar = new MindARThree({
                container: document.getElementById('ar'),
                imageTargetSrc: 'targets.mind',
                uiScanning: 'no',
                uiLoading: 'yes'
            });
            const { renderer, scene, camera } = mindar;
            const anchor = mindar.addAnchor(0);

            let plane;
            if (useVideo) {
                const videoTexture = new THREE.VideoTexture(video);
                videoTexture.colorSpace = THREE.SRGBColorSpace;
                plane = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, CARD_ASPECT),
                    new THREE.MeshBasicMaterial({ map: videoTexture })
                );
                // Fit the video inside the card while keeping its shape.
                const fit = () => {
                    const aspect = video.videoHeight / video.videoWidth;
                    if (!aspect) return;
                    const scale = aspect > CARD_ASPECT ? CARD_ASPECT / aspect : 1;
                    plane.scale.set(scale, (aspect / CARD_ASPECT) * scale, 1);
                };
                video.addEventListener('loadedmetadata', fit);
                fit();
            } else {
                plane = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, CARD_ASPECT),
                    new THREE.MeshBasicMaterial({ map: texture, transparent: true })
                );
            }
            anchor.group.add(plane);

            let foundAt = null;
            anchor.onTargetFound = () => {
                foundAt = performance.now();
                hint.hidden = true;
                if (useVideo) video.play().catch(() => { video.muted = true; video.play(); });
            };
            anchor.onTargetLost = () => {
                foundAt = null;
                hint.hidden = false;
                if (useVideo) video.pause();
            };

            try {
                await mindar.start();
            } catch (e) {
                startScreen.hidden = false;
                startScreen.querySelector('p').textContent = 'The camera could not start. Please allow camera access and use https.';
                return;
            }
            hint.hidden = false;
            renderer.setAnimationLoop(() => {
                if (!useVideo && foundAt !== null) draw((performance.now() - foundAt) / 1000);
                renderer.render(scene, camera);
            });
        }

        document.getElementById('start-btn').addEventListener('click', start);
    </script>
</body>

</html>
